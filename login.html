<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log In - Interview Prep Pro</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .login-container {
      display: flex;
      max-width: 1000px;
      width: 100%;
      background: white;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    
    .login-banner {
      flex: 1;
      background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                  url('https://images.unsplash.com/photo-1552664730-d307ca884978?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1470&q=80') center/cover no-repeat;
      color: white;
      padding: 50px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }
    
    .login-banner h2 {
      font-size: 2.2rem;
      margin-bottom: 15px;
      font-weight: 700;
    }
    
    .login-banner p {
      font-size: 1.1rem;
      line-height: 1.6;
      opacity: 0.9;
      max-width: 400px;
      margin: 0 auto;
    }
    
    .login-form {
      flex: 1;
      padding: 50px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .logo-container {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .logo-container img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 2px solid #4a6cf7;
      box-shadow: 0 5px 15px rgba(74, 108, 247, 0.2);
    }
    
    .logo-container h1 {
      color: #333;
      font-size: 1.8rem;
      margin: 0;
      font-weight: 700;
    }
    
    .logo-container p {
      color: #666;
      font-size: 0.95rem;
      margin-top: 5px;
    }
    
    #loginForm h2 {
      text-align: center;
      margin-bottom: 10px;
      color: #333;
      font-size: 1.8rem;
      font-weight: 600;
    }
    
    .form-description {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 1rem;
    }
    
    .form-section {
      margin-bottom: 25px;
      padding: 25px;
      background: #f8f9ff;
      border-radius: 15px;
      border: 1px solid #eef1ff;
    }
    
    .form-section h3 {
      margin: 0 0 20px 0;
      color: #4a6cf7;
      font-size: 1.2rem;
      font-weight: 600;
      text-align: center;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #444;
      font-size: 0.95rem;
    }
    
    input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
      transition: all 0.3s ease;
      background: #fff;
    }
    
    input:focus {
      outline: none;
      border-color: #4a6cf7;
      box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.1);
    }
    
    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #4a6cf7 0%, #6c8dff 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      box-shadow: 0 5px 15px rgba(74, 108, 247, 0.3);
    }
    
    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(74, 108, 247, 0.4);
    }
    
    button:active {
      transform: translateY(-1px);
    }
    
    .form-footer {
      text-align: center;
      margin-top: 25px;
      color: #666;
      font-size: 1rem;
    }
    
    .form-footer a {
      color: #4a6cf7;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    
    .form-footer a:hover {
      text-decoration: underline;
    }
    
    @media (max-width: 768px) {
      .login-container {
        flex-direction: column;
      }
      
      .login-banner {
        padding: 30px 20px;
        min-height: 250px;
      }
      
      .login-form {
        padding: 30px 20px;
      }
      
      .login-banner h2 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-banner">
      <h2>Master Your Interview Skills</h2>
      <p>Get expert guidance and practice with our interview preparation assistant</p>
    </div>
    
    <div class="login-form">
      <div class="logo-container">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Interview Prep Pro Logo" />
        <h1>Interview Prep Pro</h1>
        <p>Professional Interview Preparation Platform</p>
      </div>
      
      <form id="loginForm">
        <h2>Welcome Back</h2>
        <p class="form-description">Enter your credentials to access your account</p>
        
        <div class="form-section">
          <h3>Account Access</h3>
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email" />
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password" />
        </div>
        
        <button type="submit">Sign In</button>
        
        <div class="form-footer">
          <p>Don't have an account? <a href="signup.html">Create Account</a></p>
        </div>
      </form>
    </div>
  </div>
  
  <script src="login.js"></script>
</body>
</html>
