<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Gemini API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        button { padding: 10px 20px; margin: 10px 0; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 4px; white-space: pre-wrap; }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <h1>Gemini API Test</h1>
    
    <div class="test-section">
        <h2>Test 1: Direct Gemini API Call</h2>
        <button onclick="testDirectGemini()">Test Direct Gemini API</button>
        <div id="direct-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>Test 2: Backend Server Call</h2>
        <button onclick="testBackendServer()">Test Backend Server</button>
        <div id="backend-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>Test 3: Interview Bot API Call</h2>
        <button onclick="testInterviewBot()">Test Interview Bot API</button>
        <div id="interview-result" class="result"></div>
    </div>

    <script>
        const GEMINI_API_KEY = "AIzaSyC2Fq8E80ZGbi8Izbjm72fd8p4G7daYWr4";
        const GEMINI_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent";
        
        async function testDirectGemini() {
            const resultDiv = document.getElementById('direct-result');
            resultDiv.textContent = 'Testing direct Gemini API call...';
            
            try {
                const response = await fetch(`${GEMINI_URL}?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            role: "user",
                            parts: [{ text: "Hello, can you help me with interview preparation?" }]
                        }],
                        generationConfig: { temperature: 0.9, topP: 0.9, topK: 40 }
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${JSON.stringify(data)}`);
                }
                
                const text = data.candidates[0].content.parts[0].text;
                resultDiv.textContent = `SUCCESS: ${text}`;
                resultDiv.className = 'result success';
            } catch (error) {
                resultDiv.textContent = `ERROR: ${error.message}`;
                resultDiv.className = 'result error';
            }
        }
        
        async function testBackendServer() {
            const resultDiv = document.getElementById('backend-result');
            resultDiv.textContent = 'Testing backend server connection...';
            
            try {
                const response = await fetch('http://localhost:3000/api/gemini-generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            role: "user",
                            parts: [{ text: "Hello, can you help me with interview preparation?" }]
                        }],
                        generationConfig: { temperature: 0.9, topP: 0.9, topK: 40 }
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${JSON.stringify(data)}`);
                }
                
                const text = data.candidates[0].content.parts[0].text;
                resultDiv.textContent = `SUCCESS: ${text}`;
                resultDiv.className = 'result success';
            } catch (error) {
                resultDiv.textContent = `ERROR: ${error.message}`;
                resultDiv.className = 'result error';
            }
        }
        
        async function testInterviewBot() {
            const resultDiv = document.getElementById('interview-result');
            resultDiv.textContent = 'Testing interview bot API call...';
            
            try {
                const response = await fetch('http://localhost:3000/api/gemini-generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            role: "user",
                            parts: [{ text: "What are the most common job interview questions?" }]
                        }]
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${JSON.stringify(data)}`);
                }
                
                const text = data.candidates[0].content.parts[0].text;
                resultDiv.textContent = `SUCCESS: ${text}`;
                resultDiv.className = 'result success';
            } catch (error) {
                resultDiv.textContent = `ERROR: ${error.message}`;
                resultDiv.className = 'result error';
            }
        }
    </script>
</body>
</html>
